{% extends 'base.html' %}
{% block title %}AI Assistant — Mega App{% endblock %}

{% block extra_head %}
<style>
  #chat-box {
    height: 500px;
    overflow-y: auto;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 16px;
    background: #f8f9fa;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 18px;
    margin-bottom: 10px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .bubble-user {
    background: #007bff;
    color: #fff;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .bubble-ai {
    background: #fff;
    border: 1px solid #dee2e6;
    border-bottom-left-radius: 4px;
  }
  .cursor::after {
    content: '▋';
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #send-btn { min-width: 80px; }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h2 class="mb-1">&#129302; AI Assistant</h2>
    <p class="text-muted mb-3">Ask anything about your tasks, habits, budget, fitness, or get personalised advice.</p>

    <div id="chat-box"></div>

    <form id="chat-form" class="mt-3">
      <div class="input-group">
        <input id="user-input" type="text" class="form-control" placeholder="Ask me anything…" autocomplete="off" required>
        <div class="input-group-append">
          <button id="send-btn" class="btn btn-primary" type="submit">Send</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  const chatBox = document.getElementById('chat-box');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const history = [];

  function appendBubble(role, text) {
    const div = document.createElement('div');
    div.className = 'd-flex ' + (role === 'user' ? 'justify-content-end' : 'justify-content-start');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'bubble-user' : 'bubble-ai');
    bubble.textContent = text;
    div.appendChild(bubble);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    sendBtn.disabled = true;
    appendBubble('user', text);
    history.push({ role: 'user', content: text });

    const aiBubble = appendBubble('assistant', '');
    aiBubble.classList.add('cursor');
    let accumulated = '';

    try {
      const resp = await fetch('/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          const raw = part.slice(6).trim();
          if (raw === '[DONE]') break;
          try {
            const obj = JSON.parse(raw);
            if (obj.error) {
              aiBubble.textContent = 'Error: ' + obj.error;
              aiBubble.classList.remove('cursor');
              return;
            }
            if (obj.text) {
              accumulated += obj.text;
              aiBubble.textContent = accumulated;
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          } catch (_) {}
        }
      }
    } catch (err) {
      aiBubble.textContent = 'Network error: ' + err.message;
    }

    aiBubble.classList.remove('cursor');
    history.push({ role: 'assistant', content: accumulated });
    sendBtn.disabled = false;
    input.focus();
  });
</script>
{% endblock %}
